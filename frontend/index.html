<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMR 讀卡系統</title>
    <style>
        body { font-family: sans-serif; padding: 20px; text-align: center; background-color: #f5f5f5; }
        /* 加上白色背景確保螢幕截圖或翻拍時不會變透明黑底 */
        canvas { border: 1px solid #ccc; max-width: 100%; margin-bottom: 20px; cursor: pointer; background-color: white; }
        button, input { margin: 10px; padding: 10px; font-size: 16px; }
        #status { margin-top: 10px; color: blue; font-weight: bold; }
        .error { color: red !important; }
    </style>
</head>
<body>

    <h2>1. 答案卡預覽 (可直接點擊圓圈作答)</h2>
    <canvas id="answerCard" width="600" height="800"></canvas>
    <br>
    
    <h2>2. 拍照讀卡</h2>
    <input type="file" accept="image/*" capture="environment" id="fileUpload">
    <div id="status"></div>
    
    <script>
    // --- 繪製可互動的答案卡 ---
    const canvas = document.getElementById('answerCard');
    const ctx = canvas.getContext('2d');
    const bubbles = []; 

    // 1. 先把整張畫布塗成純白色 (避免透明背景在某些裝置上變黑色)
    ctx.fillStyle = 'white';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    function drawMarkers() {
        ctx.fillStyle = 'black';
        const size = 30;
        ctx.fillRect(20, 20, size, size); // 左上
        ctx.fillRect(550, 20, size, size); // 右上
        ctx.fillRect(20, 750, size, size); // 左下
        ctx.fillRect(550, 750, size, size); // 右下
    }

    function drawQuestions() {
        ctx.lineWidth = 2; // 加粗圓圈的外框，讓 OpenCV 更好抓
        bubbles.length = 0; 
        for(let i=0; i<10; i++) { 
            for(let j=0; j<4; j++) { 
                let x = 100 + j*40;
                let y = 100 + i*40;
                ctx.beginPath();
                ctx.arc(x, y, 10, 0, Math.PI * 2);
                ctx.fillStyle = 'white'; // 確保圓圈內部是實心的白色
                ctx.fill();
                ctx.strokeStyle = 'black';
                ctx.stroke();
                bubbles.push({x: x, y: y, radius: 10, filled: false, row: i, col: j});
            }
        }
    }

    drawMarkers();
    drawQuestions();

    // 監聽點擊事件，讓圓圈可以切換塗黑/取消塗黑
    canvas.addEventListener('click', function(e) {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        const mouseX = (e.clientX - rect.left) * scaleX;
        const mouseY = (e.clientY - rect.top) * scaleY;

        bubbles.forEach(b => {
            const dx = mouseX - b.x;
            const dy = mouseY - b.y;
            if (dx*dx + dy*dy <= b.radius * b.radius) {
                b.filled = !b.filled;
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                ctx.fillStyle = b.filled ? 'black' : 'white';
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = 'black';
                ctx.stroke();
            }
        });
    });

    // --- 處理圖片上傳與後端連線 ---
    document.getElementById('fileUpload').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        const statusDiv = document.getElementById('status');
        statusDiv.className = '';
        statusDiv.innerText = "照片已上傳！伺服器辨識中，請稍候 (約需 5~50 秒)...";

        const formData = new FormData();
        formData.append("file", file);

        // 使用你專屬的 Render 網址
        fetch("https://testocr-thel.onrender.com/api/scan", {
            method: "POST",
            body: formData
        })
        .then(res => res.json())
        .then(data => {
            if(data.status === "success") {
                statusDiv.innerText = `判斷成功！最終分數: ${data.score} 分`;
                alert(`判斷成功！最終分數: ${data.score} 分`);
            } else {
                statusDiv.className = 'error';
                statusDiv.innerText = `辨識失敗：${data.message}`;
                alert(`辨識失敗：\n${data.message}`);
            }
        })
        .catch(err => {
            console.error(err);
            statusDiv.className = 'error';
            statusDiv.innerText = "連線發生錯誤，請檢查後端狀態。";
            alert("連線發生錯誤，請檢查後端是否正常運作。");
        });
    });
    </script>
</body>
</html>
